name: CI

# Maith CI — the build oracle + integrity gates.
#
# Protocol ported from PleaNP (2026-09-15). Two jobs, mirroring the two trust
# boundaries PleaNP separates:
#
#   1. Lean build + test suite  — the kernel is the oracle for *proofs/code*.
#   2. Integrity gates (Tier 1) — for *statements and definitions* that the
#      kernel cannot audit: no sorry/admit/axiom, no vacuous bodies, no inert
#      binders. See docs/TOOLCHAIN_AND_CI.md.
#
# Runs on main and dev (the review branch). A green check here means "the code
# builds, the tests pass, and the Tier-1 mechanical checks are clean" — it is
# necessary, not sufficient, for a validated claim (Tier 2 is the local
# agent's `#print axioms` step; the semantic step is human review).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  lean:
    name: Lean build + test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        run: lean --version

      - name: Restore Mathlib olean cache (community Azure cache)
        run: lake exe cache get

      - name: Build test target
        run: lake build tests

      # Hard gate since #25: the harness now exits non-zero on any unexpected
      # failure. Pre-existing failures are listed explicitly in
      # Tests.Harness.knownFailures (with their tracking notes) and are reported
      # as SKIP; anything else fails the build. This replaces the previous
      # grep-the-output workaround, which could not distinguish a clean run from
      # a broken one.
      #
      # Run under `lake env` so the `lean` binary the decompiler validity test
      # shells out to is on PATH.
      - name: Run Lean test suite
        run: lake env ./.lake/build/bin/tests

  gates:
    name: Integrity gates (Tier 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hygiene scan (Gate 6 Tier 1 — no sorry/admit/axiom)
        run: python3 tooling/gates/hygiene_scan.py --prove-stage Maith Tests Scripts

      - name: Vacuity scan (Gate 5 Tier 1 — no dishonest placeholders)
        run: python3 tooling/gates/vacuity_scan.py Maith Tests Scripts

      # Advisory on adoption: this surfaced one pre-existing dead helper
      # (runEnvTest in Tests/ExtractionFaithfulnessTests.lean — unused `env`
      # parameter). Non-blocking until the library's entry points are
      # triaged; flip to blocking (remove continue-on-error) once clean.
      - name: Binder-usage / lethality scan (Gate 5 Tier 1b — advisory)
        continue-on-error: true
        run: |
          python3 tooling/gates/binder_usage_scan.py \
            --allow-unreferenced '^(run(All|Env|Graph)?[A-Za-z]*|main)$' \
            Maith Tests Scripts

      - name: Gate-scanner self-tests (must detect the planted cases)
        run: |
          set -e
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case2_real_sorry.lean \
            && { echo "ERROR: real sorry not detected"; exit 1; } || echo "case2 detected ok"
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case3_axiom.lean \
            && { echo "ERROR: custom axiom not detected"; exit 1; } || echo "case3 detected ok"
          python3 tooling/gates/hygiene_scan.py --prove-stage tooling/gates/tests/case5_clean.lean \
            && echo "case5 clean ok" || { echo "ERROR: clean case flagged"; exit 1; }
          python3 tooling/gates/vacuity_scan.py tooling/gates/tests/case1_placeholder.lean >/dev/null \
            && echo "vacuity clean ok" || { echo "ERROR: vacuity false positive"; exit 1; }
          python3 tooling/gates/binder_usage_scan.py tooling/gates/tests/case8_unused_param.lean \
            && { echo "ERROR: unused param not detected"; exit 1; } || echo "case8 detected ok"

  python:
    name: Python tests (stdlib-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The torch/transformers-dependent tests are excluded: they need the ML
      # stack and (for some) a built corpus. This job covers the pure-stdlib
      # invariant/schema/bucketing tests, which are exactly the ones that
      # guard the pipeline's data contract. See docs/TOOLCHAIN_AND_CI.md.
      - name: Run stdlib-only test suite
        run: |
          set -e
          for t in \
            test_build_dataset_v2 \
            test_c4_bucketing \
            test_c4_consistency \
            test_corpus_expansion_config \
            test_eval_checkpoint_guard \
            test_eval_completion_authoritative \
            test_h5_pairs \
            test_invariants ; do
            echo "::group::$t"
            python3 "python/$t.py"
            echo "::endgroup::"
          done

      # A test that passes on a broken checker is not a test. This mutates
      # check_invariants.py (one declared constraint at a time), asserts the
      # invariant-5 fixtures DETECT each mutation, and restores the file.
      # Guards against the #22 failure mode recurring.
      - name: Invariant fixtures are not vacuous (mutation check)
        run: python3 python/test_mutation_guard.py

      # Axiom-discovery ledger + coverage map (#27). The validation rules that
      # keep compression/reusable honest are themselves mutation-tested.
      - name: Candidate ledger tests
        run: python3 axiom-rewrite/test_candidates.py

      - name: Candidate ledger validation not vacuous (mutation check)
        run: python3 axiom-rewrite/test_mutation_guard.py